<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Main gradient - special purple/violet/magenta -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B52FA"/>
      <stop offset="35%" style="stop-color:#9463FC"/>
      <stop offset="65%" style="stop-color:#B873FF"/>
      <stop offset="100%" style="stop-color:#D959C7"/>
    </linearGradient>

    <!-- Glow gradient -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#9463FC;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#9463FC;stop-opacity:0"/>
    </radialGradient>

    <!-- Inner highlight -->
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#6B52FA" flood-opacity="0.5"/>
    </filter>

    <!-- Waveform clip path -->
    <clipPath id="waveClip">
      <rect x="120" y="180" width="272" height="152" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glowGradient)"/>

  <!-- Main rounded square background -->
  <rect x="56" y="56" width="400" height="400" rx="90" ry="90"
        fill="url(#mainGradient)" filter="url(#shadow)"/>

  <!-- Inner highlight overlay -->
  <rect x="56" y="56" width="400" height="200" rx="90" ry="90"
        fill="url(#highlightGradient)"/>

  <!-- Waveform bars - representing audio/voice -->
  <g fill="#ffffff" opacity="0.95">
    <!-- Center waveform visualization -->
    <rect x="136" y="220" width="12" height="72" rx="6"/>
    <rect x="160" y="195" width="12" height="122" rx="6"/>
    <rect x="184" y="210" width="12" height="92" rx="6"/>
    <rect x="208" y="175" width="12" height="162" rx="6"/>
    <rect x="232" y="190" width="12" height="132" rx="6"/>
    <rect x="256" y="160" width="12" height="192" rx="6"/>
    <rect x="280" y="190" width="12" height="132" rx="6"/>
    <rect x="304" y="175" width="12" height="162" rx="6"/>
    <rect x="328" y="210" width="12" height="92" rx="6"/>
    <rect x="352" y="195" width="12" height="122" rx="6"/>
    <rect x="376" y="220" width="12" height="72" rx="6"/>
  </g>

  <!-- Circular ripple rings (voice/echo effect) -->
  <g fill="none" stroke="#ffffff" stroke-width="3" opacity="0.3">
    <circle cx="256" cy="256" r="160"/>
    <circle cx="256" cy="256" r="140" opacity="0.5"/>
    <circle cx="256" cy="256" r="120" opacity="0.7"/>
  </g>

  <!-- Small accent dot (brand element) -->
  <circle cx="400" cy="120" r="20" fill="#ffffff" opacity="0.9"/>

  <!-- "E" letterform subtly integrated (optional brand mark) -->
  <g fill="#ffffff" opacity="0.15">
    <rect x="100" y="380" width="60" height="8" rx="4"/>
    <rect x="100" y="395" width="40" height="8" rx="4"/>
    <rect x="100" y="410" width="60" height="8" rx="4"/>
  </g>
</svg>
