[package]
name = "echocore-pro"
version = "2.0.0"
description = "EchoCore Pro - Neural Voice Studio"
authors = ["NODAYSIDLE"]
edition = "2021"

[lib]
name = "echocore_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
