<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#151b28" />
      <stop offset="60%" stop-color="#0a0c12" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Outer Glow -->
    <linearGradient id="strokeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Waveform Gradients -->
    <linearGradient id="waveCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <linearGradient id="wavePurple" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGlow)" stroke="url(#strokeGradient)" stroke-width="6" />

  <!-- Inner Highlight Specular Ring -->
  <rect x="30" y="30" width="452" height="452" rx="102" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Sonic Circular Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(6, 182, 212, 0.08)" stroke-width="2" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(139, 92, 246, 0.12)" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Glowing Sound Waveform Bars (Symmetric, Dynamic Heights) -->
  <g filter="url(#neonGlow)">
    <!-- Bar 1 (Outer Left) -->
    <rect x="120" y="226" width="16" height="60" rx="8" fill="url(#waveCyan)" />
    <!-- Bar 2 -->
    <rect x="150" y="196" width="16" height="120" rx="8" fill="url(#waveCyan)" />
    <!-- Bar 3 -->
    <rect x="180" y="156" width="16" height="200" rx="8" fill="url(#waveCyan)" />
    <!-- Bar 4 -->
    <rect x="210" y="206" width="16" height="100" rx="8" fill="url(#wavePurple)" />
    <!-- Center Bar 5 (Hero) -->
    <rect x="248" y="116" width="16" height="280" rx="8" fill="url(#waveCyan)" />
    <!-- Bar 6 -->
    <rect x="286" y="186" width="16" height="140" rx="8" fill="url(#wavePurple)" />
    <!-- Bar 7 -->
    <rect x="316" y="146" width="16" height="220" rx="8" fill="url(#wavePurple)" />
    <!-- Bar 8 -->
    <rect x="346" y="206" width="16" height="100" rx="8" fill="url(#waveCyan)" />
    <!-- Bar 9 (Outer Right) -->
    <rect x="376" y="236" width="16" height="40" rx="8" fill="url(#waveCyan)" />
  </g>

  <!-- Sparkling Neural Core Node -->
  <circle cx="256" cy="256" r="6" fill="#ffffff" filter="url(#neonGlow)" />
</svg>
